---
- name: "Check if Oh My Zsh is installed for {{ item.user }}"
  ansible.builtin.stat:
    path: "{{ item.home }}/.oh-my-zsh"
  register: zsh_omz_stat

- name: "whoami base"
  ansible.builtin.shell: >
    whoami

- name: "whoami root"
  ansible.builtin.shell: >
    whoami
  become: true

- name: "whoami {{ item.user }}"
  ansible.builtin.shell: >
    whoami
  become: true
  become_user: "{{ item.user }}"

- name: "Clone Oh My Zsh for {{ item.user }}"
  ansible.builtin.git:
    repo: "https://github.com/ohmyzsh/ohmyzsh.git"
    dest: "{{ item.home }}/.oh-my-zsh"
    version: master
    depth: 1
  when: not zsh_omz_stat.stat.exists
  become: true
  become_user: "{{ item.user }}"

- name: "Install custom ZSH plugins for {{ item.user }}"
  ansible.builtin.git:
    repo: "{{ plugin.repo }}"
    dest: "{{ item.home }}/.oh-my-zsh/custom/plugins/{{ plugin.name }}"
    version: master
    depth: 1
  loop:
    - { name: "zsh-syntax-highlighting", repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git" }
    - { name: "zsh-autosuggestions", repo: "https://github.com/zsh-users/zsh-autosuggestions" }
  loop_control:
    loop_var: plugin
  become: true
  become_user: "{{ item.user }}"

- name: "Deploy .zshrc for {{ item.user }}"
  ansible.builtin.copy:
    src: zshrc
    dest: "{{ item.home }}/.zshrc"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0644"
