name: Ansible Lint
on:
  push:
    branches: ["main", "master", "develop", "feature/*", "bugfix/*", "hotfix/*"]
  pull_request:
    branches: ["main", "master", "develop", "feature/*", "bugfix/*", "hotfix/*"]

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ansible-lint
        uses: ansible/ansible-lint-action@v6
