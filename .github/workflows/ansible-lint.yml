name: ansible-lint
on:
  push:
    branches:
      [
        "main",
        "master",
        "develop",
        "feature/*",
        "bugfix/*",
        "hotfix/*",
        "release/*",
      ]
  pull_request:
    branches:
      [
        "main",
        "master",
        "develop",
        "feature/*",
        "bugfix/*",
        "hotfix/*",
        "release/*",
      ]
jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run ansible-lint
        uses: ansible/ansible-lint@v25.12.2
        with:
          args: ""
          setup_python: "true"
          python_version: "3.14"
          working_directory: ""
          requirements_file: "requirements.yml"
