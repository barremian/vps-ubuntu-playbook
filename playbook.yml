---
- name: VPS Initial Setup
  hosts: all
  become: true

  vars_prompt:
    - name: ssh_key_path
      prompt: "Enter the local path to your public SSH key (e.g., ~/.ssh/id_rsa.pub)"
      private: false
      default: "~/.ssh/id_rsa.pub"
    - name: new_user
      prompt: "Enter the username for the new user to create"
      private: false
      default: "developer"

  roles:
    - common
    - docker
    - fail2ban
    - ufw
    - user_management
    - zsh
    - ssh_setup
    - cleanup
